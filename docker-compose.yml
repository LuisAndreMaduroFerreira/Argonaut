services:
  argonaut-db:
    image: postgres:16-alpine
    container_name: argonaut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: argonaut
      # Only used the first time the database is created. To change it later, see the README.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argonaut}
      POSTGRES_DB: argonaut
    # Published on this PC only (both loopback addresses), never on the network: the dev API
    # and the tests reach the database here.
    ports:
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    volumes:
      - argonaut-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argonaut"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        ipv4_address: 172.30.87.10

  # Spell checking only: hunspell dictionaries for English, Portuguese, French and Spanish.
  # It holds no notes and never touches the database, and isn't published to the host.
  argonaut-spell:
    build:
      context: ./spell
      dockerfile: Dockerfile
    container_name: argonaut-spell
    restart: unless-stopped
    environment:
      PORT: 8790
    expose:
      - "8790"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8790/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        ipv4_address: 172.30.87.11

  # Speech to text for the assistant's microphone: whisper.cpp with the multilingual base
  # model, on this PC's CPU. Recordings arrive from the API, are transcribed in memory and
  # dropped. It holds no notes, never touches the database, and isn't published to the host.
  argonaut-whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: argonaut-whisper
    restart: unless-stopped
    expose:
      - "8792"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8792/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        ipv4_address: 172.30.87.13

  # Serves the API and the built web app on the same port.
  argonaut-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: argonaut-api
    restart: unless-stopped
    environment:
      PGHOST: argonaut-db
      PGPORT: 5432
      PGUSER: argonaut
      PGPASSWORD: ${POSTGRES_PASSWORD:-argonaut}
      PGDATABASE: argonaut
      PORT: 8787
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      SETTINGS_FILE: ${SETTINGS_FILE:-}
      SPELL_URL: http://argonaut-spell:8790
      WHISPER_URL: http://argonaut-whisper:8792
    # This PC only: the API has no sign-in, so it must not be reachable from the network.
    ports:
      - "127.0.0.1:8787:8787"
      - "[::1]:8787:8787"
    depends_on:
      argonaut-db:
        condition: service_healthy
      argonaut-spell:
        condition: service_started
      argonaut-whisper:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.30.87.12

# Fixed addresses. When Docker Desktop stops abruptly, the containers restart in whatever order
# and would take each other's addresses, while Docker can keep forwarding ports 8787 and 5433
# to the old ones: the app then gets empty replies and nothing saves (seen 2026-09-30).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.87.0/24

volumes:
  argonaut-db-data:
